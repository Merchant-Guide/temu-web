<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>运营信息中心</title>
<script>
  (function () {
    try {
      var t = null;
      try { t = localStorage.getItem('ops-center-theme'); } catch (_) {}
      if (t !== 'light' && t !== 'dark') t = 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (_) {}
  })();
</script>
<style>
  :root, [data-theme="light"] {
    --bg: #eef4fc;
    --bg-glow: rgba(59, 140, 201, 0.20);
    --surface: #ffffff;
    --surface-soft: #f5f9fe;
    --surface-hover: #f2f8ff;
    --border: #dde8f6;
    --border-strong: #c9daf0;
    --text: #0e2a4d;
    --text-muted: #5c7391;
    --text-faint: #8ba0b9;
    --accent: #1b4f9e;
    --accent-2: #3b8cc9;
    --accent-soft: rgba(27, 79, 158, 0.08);
    --accent-line: linear-gradient(180deg, #1b4f9e, #3b8cc9);
    --chip-bg: #e8f2fd;
    --chip-text: #1b4f9e;
    --shadow: 0 1px 2px rgba(14, 42, 77, 0.05), 0 10px 26px rgba(14, 42, 77, 0.06);
    --shadow-hover: 0 6px 18px rgba(14, 42, 77, 0.10), 0 18px 40px rgba(14, 42, 77, 0.08);
    --toolbar-bg: rgba(255, 255, 255, 0.88);
    --dot: rgba(27, 79, 158, 0.10);
  }
  [data-theme="dark"] {
    --bg: #071320;
    --bg-glow: rgba(59, 140, 201, 0.22);
    --surface: #0e1f33;
    --surface-soft: #12263c;
    --surface-hover: #162c45;
    --border: #1d3550;
    --border-strong: #27465f;
    --text: #e7effb;
    --text-muted: #93a9c4;
    --text-faint: #6d839c;
    --accent: #6ea8ff;
    --accent-2: #4fa3d8;
    --accent-soft: rgba(110, 168, 255, 0.12);
    --accent-line: linear-gradient(180deg, #6ea8ff, #3b8cc9);
    --chip-bg: rgba(110, 168, 255, 0.16);
    --chip-text: #9ec6ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 30px rgba(0, 0, 0, 0.30);
    --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.45);
    --toolbar-bg: rgba(14, 31, 51, 0.9);
    --dot: rgba(110, 168, 255, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1100px 420px at 50% -180px, var(--bg-glow), transparent 70%),
      radial-gradient(700px 320px at 100% 0%, var(--dot), transparent 65%),
      var(--bg);
    transition: background-color .25s ease, color .25s ease;
  }
  .toolbar {
    position: fixed; top: 16px; right: 16px; z-index: 90;
    display: flex; gap: 8px; align-items: center;
    background: var(--toolbar-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 6px; box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }
  .toolbar button {
    border: none; background: transparent; color: var(--text-muted);
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: background .15s ease, color .15s ease;
  }
  .toolbar button:hover { background: var(--accent-soft); color: var(--accent); }

  .wrap { max-width: 1160px; margin: 0 auto; padding: 62px 24px 90px; }

  .banner-wrap { position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 18px 44px rgba(11, 61, 145, 0.16); }
  .banner { display: block; width: 100%; height: auto; }

  /* 搜索 */
  .search-box { position: relative; max-width: 680px; margin: 26px auto 0; }
  .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-faint); pointer-events: none; }
  .search-input {
    width: 100%; padding: 15px 46px 15px 46px; font-size: 15px; font-family: inherit;
    color: var(--text); background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 14px; box-shadow: var(--shadow); outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search-input::placeholder { color: var(--text-faint); }
  .search-input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
  .clear-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--text-faint); font-size: 14px; cursor: pointer; display: none; }
  .clear-btn:hover { color: var(--text); }
  .search-hints { max-width: 680px; margin: 14px auto 0; }
  .hints-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .hints-label { font-size: 12px; color: var(--text-faint); white-space: nowrap; }
  .hint-chip {
    display: inline-flex; align-items: center; font-size: 12.5px; color: var(--accent);
    background: var(--chip-bg); border: 1px solid transparent; border-radius: 999px;
    padding: 5px 13px; cursor: pointer; font-family: inherit; transition: all .15s ease;
  }
  .hint-chip:hover { background: var(--accent-soft); transform: translateY(-1px); border-color: var(--border-strong); }

  /* 模块 */
  .modules { margin-top: 34px; }
  .module { margin-bottom: 34px; }
  .m-head { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
  .m-bar { width: 4px; height: 20px; border-radius: 3px; background: var(--accent-line); flex-shrink: 0; }
  .m-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .m-desc { font-size: 12.5px; color: var(--text-muted); }
  .m-count { font-size: 11.5px; font-weight: 700; color: var(--chip-text); background: var(--chip-bg); border-radius: 999px; padding: 2px 9px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 13px; }
  .card {
    display: flex; align-items: flex-start; gap: 12px; padding: 15px 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    text-decoration: none; color: var(--text); cursor: pointer; position: relative;
    box-shadow: var(--shadow); transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover { border-color: var(--accent-2); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .card-ic {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; display: flex;
    align-items: center; justify-content: center; font-size: 17px;
    background: var(--accent-soft); border: 1px solid var(--border);
  }
  .card-main { flex: 1; min-width: 0; }
  .card-t { font-size: 14.5px; font-weight: 600; line-height: 1.45; }
  .card-d { margin-top: 5px; font-size: 12.5px; color: var(--text-muted); line-height: 1.55; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .lk-copy {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--accent);
    font-family: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
    padding: 3px 9px; border-radius: 999px; cursor: pointer; flex-shrink: 0;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .lk-copy:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row-copy {
    border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    font-family: inherit; font-size: 10.5px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px; cursor: pointer; flex-shrink: 0;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .row-copy:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tagpill { font-size: 10.5px; font-weight: 700; letter-spacing: .02em; color: var(--chip-text); background: var(--chip-bg); border-radius: 6px; padding: 2.5px 8px; }
  .tagpage { font-size: 10.5px; font-weight: 700; color: #7a5a00; background: #fdf1cf; border-radius: 6px; padding: 2.5px 8px; }
  [data-theme="dark"] .tagpage { color: #ffd977; background: rgba(255, 217, 119, 0.14); }
  .card-arrow { color: var(--text-faint); font-size: 14px; margin-top: 2px; transition: color .15s ease, transform .15s ease; }
  .card:hover .card-arrow { color: var(--accent); transform: translate(2px, -2px); }
  .card.no-link { cursor: default; }
  .card.no-link:hover { transform: none; box-shadow: var(--shadow); border-color: var(--border); }
  .card.no-link .card-arrow { display: none; }

  /* 文本行列表 */
  .rows { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 4px 18px; }
  .row {
    display: flex; align-items: center; gap: 11px; padding: 12px 4px;
    text-decoration: none; color: var(--text); border-bottom: 1px solid var(--border);
    font-size: 14px; transition: color .15s ease;
  }
  .row:last-child { border-bottom: none; }
  /* 长列表：框内滚动 */
  .rows.scroll { max-height: 342px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .rows.scroll::-webkit-scrollbar { width: 7px; }
  .rows.scroll::-webkit-scrollbar-track { background: transparent; }
  .rows.scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; border: 2px solid var(--surface); }
  .rows.scroll::-webkit-scrollbar-thumb:hover { background: var(--accent-2); }
  .rows.scroll .row { padding-right: 8px; }
  .row:hover { color: var(--accent); }
  .row .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); flex-shrink: 0; }
  .row .rt { flex: 1; line-height: 1.5; }
  .row .ra { color: var(--text-faint); font-size: 13px; }
  .row:hover .ra { color: var(--accent); transform: translate(2px, -1px); }

  /* 通知 */
  .notice-list { max-height: 320px; overflow-y: auto; }
  .notice-item { display: flex; align-items: center; gap: 10px; padding: 12px 4px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--border); font-size: 14px; cursor: pointer; }
  .notice-item:last-child { border-bottom: none; }
  .notice-item:hover { color: var(--accent); }
  .nl-tag { flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--chip-bg); border-radius: 6px; padding: 3px 8px; }
  .nl-title { flex: 1; min-width: 0; line-height: 1.5; }
  .nl-date { flex-shrink: 0; font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .nl-new { flex-shrink: 0; font-size: 10px; font-weight: 800; letter-spacing: .03em; color: #fff; background: #e11d48; border-radius: 5px; padding: 2px 6px; }

  /* 分页视图 */
  #page-view { display: none; }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); margin: 4px 0 16px; flex-wrap: wrap; }
  .crumb button { border: 1px solid var(--border); background: var(--surface); color: var(--accent); font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
  .crumb button:hover { background: var(--accent-soft); }
  .crumb .sep { color: var(--text-faint); }
  .pv-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 26px 28px 30px; }
  .pv-title { font-size: 23px; font-weight: 750; margin: 0 0 6px; letter-spacing: -0.01em; }
  .pv-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .pv-open { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 13px; font-weight: 600; color: #fff; background: var(--accent); text-decoration: none; padding: 9px 16px; border-radius: 10px; }
  .pv-open:hover { background: var(--accent-2); }
  .pv-body { margin-top: 22px; }
  .blk-h { font-size: 14.5px; font-weight: 700; margin: 24px 0 10px; display: flex; align-items: center; gap: 9px; }
  .blk-h::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent-line); }
  .blk-h:first-child { margin-top: 0; }
  .blk-p { font-size: 13.5px; line-height: 1.85; color: var(--text); margin: 8px 0; }
  .blk-ul { margin: 8px 0; padding-left: 0; list-style: none; }
  .blk-ul li { position: relative; font-size: 13.5px; line-height: 1.85; padding-left: 16px; color: var(--text); }
  .blk-ul li::before { content: ""; position: absolute; left: 2px; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); }
  .callout { margin: 14px 0; padding: 13px 16px; font-size: 13px; line-height: 1.8; color: var(--text); background: var(--surface-soft); border-left: 3px solid var(--accent-2); border-radius: 0 10px 10px 0; }
  .lrows { display: flex; flex-direction: column; gap: 9px; margin: 12px 0; }
  .lrow {
    display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; text-decoration: none;
    color: var(--text); background: var(--surface-soft); border: 1px solid var(--border);
    border-radius: 12px; transition: all .15s ease;
  }
  .lrow:hover { border-color: var(--accent-2); background: var(--surface-hover); transform: translateX(2px); }
  .lrow-page { cursor: pointer; }
  .lrow-ic { flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px; background: var(--chip-bg); display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .lrow-main { flex: 1; min-width: 0; }
  .lrow-n { font-size: 13.5px; font-weight: 600; line-height: 1.5; }
  .lrow-s { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-top: 3px; }
  .lrow-u { font-size: 11px; color: var(--text-faint); margin-top: 5px; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .lrow-a { color: var(--text-faint); font-size: 13px; margin-top: 2px; }
  .lrow-copy { align-self: center; margin-left: 6px; }
  .lrow:hover .lrow-a { color: var(--accent); }
  .filrow { cursor: pointer; border-style: dashed; }
  .filrow .lrow-a { font-weight: 700; font-size: 14px; }

  /* 搜索结果 */
  .res-item { cursor: pointer; }
  .res-trail { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }
  .no-result { text-align: center; padding: 46px 0; color: var(--text-muted); }
  .no-result .big { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }

  /* 右下角常驻信息浮窗（不收起） */
  .dock {
    position: fixed; right: 16px; bottom: 16px; z-index: 80; width: 238px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow-hover); padding: 14px 15px 15px;
  }
  .dock-h { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .dock-sub { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 9px; }
  .dock-sep { height: 1px; background: var(--border); margin: 13px 0 12px; }
  .dock-row { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 0; }
  .dock-row .k { color: var(--text-muted); flex-shrink: 0; }
  .dock-row .v { font-weight: 600; word-break: break-all; }
  .copy-btn {
    border: none; background: var(--chip-bg); color: var(--accent); font-family: inherit;
    font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px; cursor: pointer; flex-shrink: 0;
  }
  .copy-btn:hover { background: var(--accent-soft); }
  .dock-btn {
    display: block; text-align: center; margin-top: 9px; padding: 8px 0; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 600;
    text-decoration: none; transition: background .15s ease;
  }
  .dock-btn:hover { background: var(--accent-2); }
  .dock-btn.ghost { background: var(--chip-bg); color: var(--accent); }
  .dock-btn.ghost:hover { background: var(--accent-soft); }
  @media (max-width: 1199px) {
    .dock { left: 14px; right: 14px; width: auto; bottom: 14px; }
    .wrap { padding-bottom: 360px; }
  }


  /* 账号浮窗 */
  .fab { position: fixed; right: 16px; bottom: 16px; z-index: 82; display: flex; flex-direction: column; align-items: flex-end; }
  .fab-toggle {
    display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 15px 0 6px;
    border-radius: 999px; border: 1px solid rgba(240, 121, 30, .38);
    background: var(--surface); cursor: pointer; font-family: inherit;
    font-size: 12.5px; font-weight: 700; color: #B45510; letter-spacing: .2px; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(240, 121, 30, .22);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .fab-toggle:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(240, 121, 30, .32); border-color: rgba(240, 121, 30, .7); }
  .fab-ic {
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(155deg, #FFB86B 0%, #F0791E 72%); flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .45);
  }
  .fab-ic svg { width: 18px; height: 18px; display: block; }
  .fab-toggle .fab-caret { font-size: 9px; color: #C9772E; opacity: .75; transition: transform .2s ease; }
  .fab:has(.fab-panel.open) .fab-caret { transform: rotate(180deg); }
  .fab:has(.fab-panel.open) .fab-toggle { border-color: rgba(240, 121, 30, .75); }
  .fab-panel {
    position: absolute; right: 0; bottom: 56px; width: 250px; padding: 14px 15px 15px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow-hover); opacity: 0; pointer-events: none;
    transform: translateY(6px); transition: all .18s ease;
  }
  .fab-panel.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .fab-title { font-size: 13px; font-weight: 700; }
  .fab-sub { font-size: 11.5px; color: var(--text-muted); margin: 3px 0 10px; }
  .fab-row { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 0; }
  .fab-row > span:first-child { color: var(--text-muted); flex-shrink: 0; }
  .fab-row > span:last-child { font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .fab-copy {
    border: none; background: var(--chip-bg); color: var(--accent); font-family: inherit;
    font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px; cursor: pointer;
  }
  .fab-copy:hover { background: var(--accent-soft); }
  .fab-btn {
    display: block; text-align: center; margin-top: 10px; padding: 8px 0; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 600; text-decoration: none;
  }
  .fab-btn:hover { background: var(--accent-2); }

  footer { margin-top: 44px; text-align: center; font-size: 12px; color: var(--text-faint); }
  .hidden { display: none !important; }

  #toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(16px);
    background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 10px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .22s ease; z-index: 200;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .wrap { padding: 62px 15px 96px; }
    .grid { grid-template-columns: 1fr; }
    .pv-card { padding: 20px 17px 24px; }
    .pv-title { font-size: 19px; }
    .banner-wrap { border-radius: 14px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="theme-toggle" title="切换主题">🌓 主题</button>
</div>

<div class="wrap">

    return diff >= 0 && diff < 7;
  }

        INDEX.push({ label: it.n, trail: m.title, url: it.u, page: it.page, hay: it.n.toLowerCase() });
      });
    });
    Object.keys(PAGES).forEach(function (pid) {
      if (seenPages[pid]) return;
      var p = PAGES[pid];
      INDEX.push({
        label: p.title,
        trail: PAGE_TRAILS[pid] || "分页",
        page: pid,
        hay: p.title.toLowerCase()
      });
    });
  }

  var searchInput = $("#search");
  var clearBtn = $("#clear");
  var modulesBox = $("#modules");

  function doSearch(q) {
    q = (q || "").trim().toLowerCase();
    if (!q) {
      modulesBox.classList.remove("hidden");
      var old = document.getElementById("search-results");
      if (old) old.remove();
      return;
    }
    // 仅按标题匹配；标题无命中时才用同义词兜底
    var hits = INDEX.filter(function (it) { return it.hay.indexOf(q) >= 0; });
    if (!hits.length && SYNONYMS[q]) {
      var words = SYNONYMS[q];
      hits = INDEX.filter(function (it) {
        for (var i = 0; i < words.length; i++) if (it.hay.indexOf(words[i]) >= 0) return true;
        return false;
      });
    }

    var old2 = document.getElementById("search-results");
    if (old2) old2.remove();
    modulesBox.classList.add("hidden");

    var wrap = document.createElement("section");
    wrap.id = "search-results";
    wrap.className = "module";
    var html = '<div class="m-head"><span class="m-bar"></span><span class="m-title">搜索结果</span><span class="m-count">' + hits.length + ' 条</span><span class="m-desc">关键词：' + esc(q) + '</span></div>';
    if (!hits.length) {
      html += '<div class="no-result"><div class="big">未找到相关入口</div><div>试试其他关键词，如：木制品 / 仓库 / 申诉 / 图灵 / 问卷</div></div>';
    } else {
      html += '<div class="rows">';
      hits.forEach(function (it) {
        var attrs = it.page ? ' data-page="' + esc(it.page) + '"' : ' data-url="' + esc(it.url) + '"';
        html += '<div class="row res-item"' + attrs + ' style="cursor:pointer">' +
          '<span class="dot"></span><span class="rt">' + esc(it.label) +
          '<div class="res-trail">' + esc(it.trail) + (it.page ? '' : ' · ' + esc(host(it.url))) + '</div>' +
          '</span><span class="ra">' + (it.page ? "›" : "↗") + '</span></div>';
      });
      html += '</div>';
    }
    wrap.innerHTML = html;
    modulesBox.parentNode.insertBefore(wrap, modulesBox);
  }

  searchInput.addEventListener("input", function () {
    clearBtn.style.display = this.value ? "block" : "none";
    doSearch(this.value);
  });
  clearBtn.addEventListener("click", function () {
    searchInput.value = "";
    clearBtn.style.display = "none";
    doSearch("");
    searchInput.focus();
  });
  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && this.value.trim()) { recordSearch(this.value.trim()); doSearch(this.value.trim()); }
  });

  // ===================== 常用搜索 =====================
  var COUNTS_KEY = "ops-center-search-counts";
  var MAX_COMMON = 6;
  function getCounts() { try { return JSON.parse(localStorage.getItem(COUNTS_KEY) || "{}"); } catch (e) { return {}; } }
  function recordSearch(term) {
    if (!term) return;
    var c = getCounts();
    c[term] = (c[term] || 0) + 1;
    try { localStorage.setItem(COUNTS_KEY, JSON.stringify(c)); } catch (e) {}
    renderCommon();
  }
  function makeChip(t) {
    var chip = document.createElement("button");
    chip.className = "hint-chip";
    chip.textContent = t;
    chip.addEventListener("click", function () {
      searchInput.value = t; clearBtn.style.display = "block";
      doSearch(t); recordSearch(t); searchInput.focus();
    });
    return chip;
  }
  function renderCommon() {
    var el = document.getElementById("common-hints");
    el.innerHTML = "";
    var counts = getCounts();
    var terms = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    COMMON_TERMS.forEach(function (t) { if (terms.length < MAX_COMMON && terms.indexOf(t) < 0) terms.push(t); });
    terms.slice(0, MAX_COMMON).forEach(function (t) { el.appendChild(makeChip(t)); });
  }

  function downloadEmbed(key) {
    var f = EMBED_FILES[key];
    if (!f) { flash("文件不存在"); return; }
    try {
      var bin = atob(f.b64), len = bin.length, buf = new Uint8Array(len);
      for (var i = 0; i < len; i++) buf[i] = bin.charCodeAt(i);
      var blob = new Blob([buf], { type: f.mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = f.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      flash("已开始下载：" + f.name);
    } catch (err) { flash("下载失败，请换个浏览器试试"); }
  }

  // ===================== 主题 / 浮窗 =====================
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var root = document.documentElement;
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("ops-center-theme", next); } catch (e) {}
  });
  document.getElementById("fab-toggle").addEventListener("click", function () {
    document.getElementById("fab-panel").classList.toggle("open");
  });

  // ===================== 初始化 =====================
  renderModules();
  buildIndex();
  renderCommon();
</script>
